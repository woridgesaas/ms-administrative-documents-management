spring:
  application:
    name: ms-administrative-documents-management
  flyway:
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  profiles:
    active: ${ACTIVE_PROFILE:dev}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

thymeleaf:
  prefix: classpath:/templates/
  suffix: .html
  mode: HTML
  encoding: UTF-8
  cache: false #hot reaload on dev
  check-template-location: true

ressource:
  templates:
    docs-path: "doc/"

  #Future : cache redis
  mock-tenant:
    tenant-name: "DEV-LOCAL TECH SARL"
    logo-url: "https://images.unsplash.com/photo-1662057168154-89300791ad6e?q=80&w=1160&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    address: "123 Boulevard Massira Al Khadra, Casablanca, Maroc"
    city: "Casablanca"
    ice: "001234567890001"
    rc: "45678"
    cnss: "9988776"
    phone: "+212 5 22 00 00 00"

rabbitmq:
  exchange: notification.exchange
  routing:
    documentRequestCreated: document.request.created
    documentValidated: document.validated

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  service-identifier: ${MINIO_SERVICE_IDENTIFIER}

server:
  port: 8085
  servlet:
    context-path: /api/documents

internal:
  secret-key: ${INTERNAL_SECRET_KEY}

services:
  auth-url: ${AUTH_SERVICE_URL}